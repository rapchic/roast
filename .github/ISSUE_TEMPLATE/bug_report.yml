name: Bug report
description: Report a CLI or install issue
title: "[bug]: "
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: roast version
      placeholder: "0.1.0 or `roastit --version`"
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: "node --version"
    validations:
      required: true
  - type: dropdown
    id: ide
    attributes:
      label: IDE
      options:
        - Cursor
        - Claude Code
        - Codex
        - Other
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command run
      placeholder: "npx roastit install --tools cursor --yes"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Terminal output / logs
      render: shell
